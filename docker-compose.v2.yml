# Docker Compose for OcStore 2.3 - Optimized for Coolify
# Deploy via Coolify from private GitHub repository
# Service names differ from docker-compose.yml to avoid Traefik conflicts

services:
  # OcStore 2.3 Application (PHP 7.2-FPM + Nginx)
  opencartv2:
    build:
      context: .
      dockerfile: Dockerfile.v2
    environment:
      - DB_HOST=mariadbv2
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-opencart}
      - DB_USERNAME=${DB_USERNAME:-opencart}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PREFIX=${DB_PREFIX:-oc_}
      - OPENCART_URL=${OPENCART_URL:-http://localhost}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      # Xdebug disabled by default for performance
      # Set to 1 for development debugging
      - XDEBUG_ENABLED=${XDEBUG_ENABLED:-0}
    volumes:
      - opencartv2_storage:/var/www/storage
      - opencartv2_html:/var/www/html
    depends_on:
      mariadbv2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.opencartv2.loadbalancer.server.port=80"

  # MariaDB Database
  mariadbv2:
    image: mariadb:10.6
    hostname: mariadbv2
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-opencart}
      - MYSQL_USER=${DB_USERNAME:-opencart}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - mariadbv2_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # FileBrowser (Web File Manager)
  filebrowserv2:
    image: hurlenko/filebrowser
    user: "33:33"
    volumes:
      - opencartv2_html:/data/html
      - opencartv2_storage:/data/storage
      - filebrowserv2_data:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.filebrowserv2.loadbalancer.server.port=8080"

  # phpMyAdmin (Database Management)
  phpmyadminv2:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      - PMA_HOST=mariadbv2
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
      - MEMORY_LIMIT=512M
      - MAX_EXECUTION_TIME=600
    depends_on:
      mariadbv2:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.phpmyadminv2.loadbalancer.server.port=80"

volumes:
  opencartv2_storage:
    driver: local
  opencartv2_html:
    driver: local
  mariadbv2_data:
    driver: local
  filebrowserv2_data:
    driver: local
