; PHP Configuration for OpenCart 3 (OcStore)
; Optimized for performance and security

;--------------------------------------------
; Memory and Execution Limits
;--------------------------------------------
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

;--------------------------------------------
; Upload Settings
;--------------------------------------------
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

;--------------------------------------------
; Error Handling (Production)
;--------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

;--------------------------------------------
; Security Settings
;--------------------------------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source

;--------------------------------------------
; Session Settings
;--------------------------------------------
session.auto_start = Off
session.use_only_cookies = On
session.use_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.cookie_secure = Off
session.cookie_samesite = Lax
session.gc_maxlifetime = 33600
session.gc_probability = 1
session.gc_divisor = 1000
session.save_handler = files
session.save_path = /var/www/html/system/storage/session

;--------------------------------------------
; Character Encoding
;--------------------------------------------
default_charset = UTF-8
mbstring.language = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.http_input = auto
mbstring.http_output = UTF-8
mbstring.detect_order = auto

;--------------------------------------------
; Date/Time Settings
;--------------------------------------------
date.timezone = Europe/Kyiv

;--------------------------------------------
; OPcache Settings (Performance Critical)
;--------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.max_wasted_percentage = 10
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.optimization_level = 0x7FFFBFFF

;--------------------------------------------
; Realpath Cache (Performance)
;--------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

;--------------------------------------------
; Output Buffering
;--------------------------------------------
output_buffering = 4096
implicit_flush = Off

;--------------------------------------------
; Zlib Compression
;--------------------------------------------
zlib.output_compression = On
zlib.output_compression_level = 6

;--------------------------------------------
; cURL Settings
;--------------------------------------------
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

;--------------------------------------------
; GD Settings
;--------------------------------------------
gd.jpeg_ignore_warning = 1
