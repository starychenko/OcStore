; PHP-FPM Pool Configuration for OcStore 2.3
; PHP 7.2 compatible (no decorate_workers_output)

[www]
; User and group
user = www-data
group = www-data

; Listen address
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager settings
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Request settings
request_terminate_timeout = 600s
request_slowlog_timeout = 30s
slowlog = /var/log/php/slow.log

; Catch workers output
catch_workers_output = yes
; Note: decorate_workers_output not available in PHP 7.2

; Clear environment
clear_env = no

; Security - limit extensions
security.limit_extensions = .php

; Access log (disabled for performance, enable for debugging)
;access.log = /var/log/php/access.log
;access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP settings overrides
php_admin_value[error_log] = /var/log/php/error.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = files
php_value[session.save_path] = /var/www/html/system/storage/session
