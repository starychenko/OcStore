# Nginx Configuration for OpenCart 3 (OcStore)
# Optimized for performance and security

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    # Character encoding
    charset utf-8;

    # Maximum upload size (matches PHP settings)
    client_max_body_size 256M;
    client_body_buffer_size 256k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Sitemap rewrites for OpenCart
    location = /sitemap.xml {
        rewrite ^(.*)$ /index.php?route=extension/feed/google_sitemap last;
    }

    location = /googlebase.xml {
        rewrite ^(.*)$ /index.php?route=extension/feed/google_base last;
    }

    # Main location - SEO URLs support
    location / {
        try_files $uri $uri/ @opencart;
    }

    # OpenCart SEO URL handler
    location @opencart {
        rewrite ^/(.+)$ /index.php?_route_=$1 last;
    }

    # Admin panel
    location /admin {
        index index.php;
        try_files $uri $uri/ /admin/index.php?$args;
    }

    # Deny access to sensitive files
    location ~* \.(tpl|twig|ini|log|sql)$ {
        deny all;
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to sensitive directories
    location ~ ^/(system|vendor)/ {
        deny all;
        return 404;
    }

    # Allow access to system/storage/download for downloadable products
    location ~ ^/system/storage/download/ {
        deny all;
        return 404;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # CSS and JS caching
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # PHP handling via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 120s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;

        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Don't cache PHP responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Deny PHP execution in uploads
    location ~* /image/.*\.php$ {
        deny all;
        return 404;
    }

    # Deny PHP execution in storage
    location ~* /system/storage/.*\.php$ {
        deny all;
        return 404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
